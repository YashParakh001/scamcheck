<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamCheck</title>
<meta name="theme-color" content="#0a0c14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0c14; --card:#131725; --card2:#1a1f30; --line:#283049; --text:#f1f3f9; --muted:#a3acc2;
    --accent:#7c8cff; --accent-ink:#0a0c14;
    --scam:#ff6b6b; --sus:#fbbf24; --safe:#34d399;
    --radius:18px; --ring:0 0 0 3px #0a0c14, 0 0 0 5px var(--accent);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; color:var(--text); background:var(--bg); font:17px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
                 background:radial-gradient(900px 500px at 15% -10%, #2a2f6b66, transparent 60%), radial-gradient(700px 500px at 110% 10%, #5b2a6b40, transparent 60%); }
  main { max-width:820px; margin:0 auto; padding:40px 16px 80px; }
  :focus-visible { outline:none; box-shadow:var(--ring); }
  button { font:inherit; color:inherit; cursor:pointer; }

  header { display:flex; align-items:center; gap:14px; margin-bottom:28px; }
  .logo { width:52px; height:52px; flex:none; display:grid; place-items:center; border-radius:14px;
          background:linear-gradient(145deg, var(--accent), #a78bfa); box-shadow:0 8px 30px #7c8cff55; }
  h1 { margin:0; font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .tagline { margin:2px 0 0; color:var(--muted); }

  .card { background:linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--line); border-radius:var(--radius);
          padding:22px; box-shadow:0 20px 50px #0006; }
  .inputs { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .label { display:block; font-weight:600; font-size:14px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  #drop { position:relative; height:220px; border:2px dashed var(--line); border-radius:14px; background:#0d1120;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center;
          color:var(--muted); padding:16px; cursor:pointer; overflow:hidden; transition:border-color .2s, background .2s; }
  #drop:hover, #drop.over { border-color:var(--accent); background:#131a33; }
  #drop strong { color:var(--text); }
  #drop .small { font-size:14px; }
  #drop img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#0d1120; }
  #remove { position:absolute; top:10px; right:10px; z-index:2; display:none; align-items:center; gap:6px; border:0; border-radius:999px;
            padding:8px 14px; background:#000c; font-size:14px; font-weight:600; }
  #drop.has-img { border-style:solid; }
  #drop.has-img #remove { display:flex; }
  #drop.scanning::after { content:""; position:absolute; left:0; right:0; height:70px; top:-70px; z-index:1;
          background:linear-gradient(180deg, transparent, #7c8cff55 70%, var(--accent)); animation:scan 1.6s ease-in-out infinite; }
  @keyframes scan { to { top:100%; } }
  textarea { width:100%; height:220px; resize:none; padding:14px; border-radius:14px; border:1px solid var(--line); background:#0d1120;
             color:var(--text); font:inherit; font-size:16px; }
  textarea::placeholder { color:#7d869d; }
  textarea:focus-visible { border-color:var(--accent); }

  .examples { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:18px; }
  .examples span { color:var(--muted); font-size:15px; margin-right:4px; }
  .chip { border:1px solid var(--line); background:#0d1120; border-radius:999px; padding:9px 16px; font-size:15px; font-weight:500; min-height:44px;
          transition:border-color .2s, background .2s; }
  .chip:hover { border-color:var(--accent); background:#161d38; }

  .actions { display:flex; align-items:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 26px; border-radius:14px;
         border:1px solid var(--line); background:var(--card2); font-weight:600; transition:transform .1s, filter .2s; }
  .btn:active { transform:scale(.98); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; font-size:18px; font-weight:700; box-shadow:0 10px 30px #7c8cff44; }
  .btn.primary:hover { filter:brightness(1.08); }
  .btn:disabled { cursor:progress; filter:saturate(.6) brightness(.9); }
  #check { flex:1 1 220px; }
  .kbd { color:var(--muted); font-size:14px; }
  kbd { font:600 13px Inter, system-ui, sans-serif; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:2px 6px; }
  .spinner { width:20px; height:20px; border:3px solid #0a0c1455; border-top-color:var(--accent-ink); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hint { color:var(--sus); margin:12px 0 0; font-weight:500; min-height:0; }
  .hint:empty { display:none; }

  #out { margin-top:28px; scroll-margin-top:16px; }
  .status { display:flex; align-items:center; gap:12px; color:var(--muted); font-weight:500; margin-bottom:16px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); animation:pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity:.25; transform:scale(.7); } }
  .skel { border-radius:12px; background:linear-gradient(90deg, #1a1f30 0%, #262d45 50%, #1a1f30 100%); background-size:200% 100%;
          animation:shimmer 1.3s linear infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }

  .hero { --c:var(--muted); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:22px; border-color:var(--c);
          background:radial-gradient(600px 200px at 0% 0%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%), var(--card); }
  .v-icon { width:84px; height:84px; border-radius:22px; display:grid; place-items:center; background:color-mix(in srgb, var(--c) 18%, transparent); color:var(--c); }
  .v-label { font-size:40px; font-weight:800; letter-spacing:.04em; line-height:1; color:var(--c); }
  .v-head { font-size:21px; font-weight:600; margin:8px 0 0; }
  .pill { display:inline-block; margin-top:12px; padding:6px 12px; border-radius:999px; font-size:15px;
          background:#ffffff12; border:1px solid var(--line); }
  .gauge { position:relative; width:108px; height:108px; }
  .gauge svg { transform:rotate(-90deg); }
  .gauge .track { stroke:#ffffff14; }
  .gauge .fill { stroke:var(--c); stroke-linecap:round; transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
  .gauge .num { position:absolute; inset:0; display:grid; place-content:center; text-align:center; font-size:26px; font-weight:800; line-height:1; }
  .gauge .num small { display:block; font-size:10px; font-weight:600; color:var(--muted); margin-top:4px; letter-spacing:.04em; text-transform:uppercase; }

  h2 { font-size:22px; margin:32px 0 14px; letter-spacing:-.01em; }
  .flag { padding:18px 20px; margin-bottom:12px; }
  .flag q { quotes:none; font-weight:600; font-size:18px; padding:1px 4px; -webkit-box-decoration-break:clone; box-decoration-break:clone;
            background:linear-gradient(104deg, #ff6b6b00 1%, #ff6b6b55 3%, #ff6b6b44 96%, #ff6b6b00 99%); border-radius:4px; }
  .flag p { margin:10px 0 0; color:#d5daea; }
  .steps { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
  .steps label { display:flex; gap:14px; align-items:flex-start; padding:16px 18px; border-radius:14px; background:var(--card); border:1px solid var(--line); cursor:pointer; }
  .steps input { appearance:none; flex:none; width:24px; height:24px; margin:1px 0 0; border:2px solid var(--accent); border-radius:7px; cursor:pointer; display:grid; place-items:center; }
  .steps input:checked { background:var(--accent); }
  .steps input:checked::after { content:""; width:6px; height:12px; border:solid var(--accent-ink); border-width:0 3px 3px 0; transform:translateY(-1px) rotate(45deg); }
  .steps input:checked + span { color:var(--muted); text-decoration:line-through; }
  .steps .n { font-weight:700; color:var(--accent); margin-right:6px; }
  .result-actions { display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; }
  .result-actions .btn { flex:1 1 180px; }

  .err { display:flex; gap:16px; align-items:flex-start; border-color:#ff6b6b66; }
  .err h3 { margin:0 0 4px; font-size:19px; }
  .err p { margin:0 0 14px; color:var(--muted); }

  .reveal { opacity:0; animation:rise .45s ease-out forwards; animation-delay:calc(var(--i, 0) * 90ms); }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  #toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%, 20px); opacity:0; pointer-events:none; z-index:10;
           background:#f1f3f9; color:#0a0c14; font-weight:600; padding:12px 20px; border-radius:999px; box-shadow:0 10px 30px #0008; transition:.25s; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  footer { margin-top:48px; text-align:center; color:#7d869d; font-size:14px; }

  @media (max-width:640px) {
    main { padding-top:24px; }
    h1 { font-size:26px; }
    .inputs { grid-template-columns:1fr; }
    #drop { height:170px; }
    textarea { height:160px; }
    .kbd { display:none; }
    #check { flex-basis:100%; }
    .hero { grid-template-columns:auto 1fr; align-items:start; gap:16px; }
    .hero .gauge { grid-column:1 / -1; justify-self:start; display:flex; align-items:center; gap:14px; width:auto; height:auto; }
    .v-icon { width:64px; height:64px; border-radius:18px; }
    .v-icon svg { width:36px; height:36px; }
    .v-label { font-size:30px; }
    .v-head { font-size:18px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:1ms !important; animation-iteration-count:1 !important; transition-duration:1ms !important; }
    #drop.scanning::after { display:none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0a0c14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    </div>
    <div>
      <h1>ScamCheck</h1>
      <p class="tagline">Paste anything suspicious. Get a verdict in seconds.</p>
    </div>
  </header>

  <section class="card" aria-label="Check a message">
    <div class="inputs">
      <div>
        <span class="label" id="shot-label">Screenshot</span>
        <div id="drop" tabindex="0" role="button" aria-labelledby="shot-label" aria-describedby="drop-hint">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg>
          <div id="drop-hint"><strong>Drop, click or paste</strong><br><span class="small">a screenshot (Ctrl/⌘+V works anywhere)</span></div>
          <button id="remove" type="button" aria-label="Remove screenshot">✕ Remove</button>
        </div>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
      <div>
        <label class="label" for="text">Message text</label>
        <textarea id="text" placeholder="Paste the text, email or link you're unsure about…"></textarea>
      </div>
    </div>

    <div class="examples">
      <span>Try an example:</span>
      <button class="chip" type="button" data-ex="package">📦 Fake package text</button>
      <button class="chip" type="button" data-ex="bank">🏦 Bank alert</button>
      <button class="chip" type="button" data-ex="job">💼 Job offer</button>
      <button class="chip" type="button" data-ex="legit">✉️ Real email</button>
    </div>

    <div class="actions">
      <button id="check" class="btn primary" type="button">Check it</button>
      <span class="kbd"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
    </div>
    <p id="hint" class="hint" role="alert"></p>
  </section>

  <section id="out" aria-live="polite" aria-busy="false"></section>
  <footer>ScamCheck gives guidance, not guarantees. When in doubt, contact the company through its official website.</footer>
</main>
<div id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), file = $('file'), text = $('text'), out = $('out'), check = $('check'), hint = $('hint');
let image = null, previewUrl = null, lastResult = null, statusTimer = null;

const EXAMPLES = {
  package: 'USPS: Your package could not be delivered due to an incomplete address. Please update your details and pay the $1.99 redelivery fee here: https://usps-redelivery-track.info/update  Reply STOP to opt out.',
  bank: 'BankOfAmerica ALERT: Your account has been LOCKED due to unusual sign-in activity. Verify your identity within 24 hours or your account will be permanently suspended: http://bofa-secure-verify.co/login',
  job: "Hi! I'm Sarah, a recruiter with Amazon Remote Jobs. Your resume was selected for a part-time position: $300-$800/day, only 60-90 minutes online. No experience needed. Please add me on WhatsApp +1 (646) 555-0192 to get started today!",
  legit: 'From: GitHub <noreply@github.com>\nSubject: [GitHub] A third-party OAuth application has been added to your account\n\nHey there! A third-party OAuth application (Netlify) with read:user and repo scopes was recently authorized to access your account. Visit https://github.com/settings/connections/applications for more information.\n\nTo see this and other security events for your account, visit https://github.com/settings/security-log',
};
const VERDICTS = {
  scam: { label: 'Scam', color: 'var(--scam)', icon: '<path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/><path d="m9.5 9.5 5 5m0-5-5 5"/>' },
  suspicious: { label: 'Suspicious', color: 'var(--sus)', icon: '<path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4.5m0 3h.01"/>' },
  safe: { label: 'Safe', color: 'var(--safe)', icon: '<path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>' },
};
const STATUS = ['Reading the message…', 'Checking known scams…', 'Weighing the evidence…', 'Almost there…'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const svg = (paths, size = 44) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function setImage(f) {
  if (!f || !f.type.startsWith('image/')) return;
  image = f;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(f);
  drop.querySelector('img')?.remove();
  const img = new Image();
  img.src = previewUrl; img.alt = 'Screenshot preview';
  drop.prepend(img);
  drop.classList.add('has-img');
  hint.textContent = '';
}
function clearImage() {
  image = null; file.value = '';
  drop.querySelector('img')?.remove();
  drop.classList.remove('has-img');
  if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
}

drop.onclick = e => { if (!e.target.closest('#remove')) file.click(); };
drop.onkeydown = e => { if (e.target === drop && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); file.click(); } };
$('remove').onclick = e => { e.stopPropagation(); clearImage(); drop.focus(); };
file.onchange = () => setImage(file.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); setImage(e.dataTransfer.files[0]); };
document.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); setImage(item.getAsFile()); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
});
document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => {
  text.value = EXAMPLES[b.dataset.ex]; hint.textContent = '';
  text.setSelectionRange(0, 0); text.focus(); text.scrollTop = 0;
});
text.oninput = () => { hint.textContent = ''; };
check.onclick = submit;

function setLoading(on) {
  check.disabled = on;
  out.setAttribute('aria-busy', on);
  drop.classList.toggle('scanning', on && !!image);
  clearInterval(statusTimer);
  if (!on) { check.textContent = 'Check it'; return; }
  check.innerHTML = '<span class="spinner" aria-hidden="true"></span>Checking…';
  let i = 0;
  out.innerHTML = `
    <div class="status"><span class="dot" aria-hidden="true"></span><span id="status">${STATUS[0]}</span></div>
    <div class="card hero" style="--c:var(--line)" aria-hidden="true">
      <div class="skel" style="width:84px;height:84px;border-radius:22px"></div>
      <div><div class="skel" style="height:34px;width:55%"></div><div class="skel" style="height:18px;width:85%;margin-top:14px"></div></div>
      <div class="skel" style="width:96px;height:96px;border-radius:50%"></div>
    </div>
    <div class="skel" style="height:90px;margin-top:28px" aria-hidden="true"></div>
    <div class="skel" style="height:90px;margin-top:12px" aria-hidden="true"></div>`;
  statusTimer = setInterval(() => { const s = $('status'); if (s) s.textContent = STATUS[++i % STATUS.length]; }, 1800);
}

async function submit() {
  if (check.disabled) return;
  const msg = text.value.trim();
  if (!image && !msg) {
    hint.textContent = 'Add a screenshot or paste a message first, or try one of the examples.';
    text.focus();
    return;
  }
  hint.textContent = '';
  const fd = new FormData();
  if (image) fd.append('image', image);
  if (msg) fd.append('text', msg);
  setLoading(true);
  out.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  try {
    const res = await fetch('/api/analyze', { method: 'POST', body: fd });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `The server answered ${res.status}.`);
    if (!VERDICTS[data.verdict]) throw new Error('The analysis came back incomplete.');
    setLoading(false);
    render(data);
  } catch (e) {
    setLoading(false);
    renderError(e.message === 'Failed to fetch' ? "Couldn't reach the server. Is it still running?" : e.message);
  }
}

function render(d) {
  lastResult = d;
  const v = VERDICTS[d.verdict];
  const conf = Math.round(Math.max(0, Math.min(100, Number(d.confidence) || 0)));
  const C = 2 * Math.PI * 44;
  const flags = (d.red_flags || []).map((f, i) => `
    <div class="card flag reveal" style="--i:${i + 2}">
      <q>${esc(f.quote)}</q>
      <p>${esc(f.why)}</p>
    </div>`).join('');
  const steps = (d.next_steps || []).map((s, i) => `
    <li class="reveal" style="--i:${i + 3}"><label><input type="checkbox"><span><span class="n">${i + 1}.</span>${esc(s)}</span></label></li>`).join('');
  out.innerHTML = `
    <div class="card hero reveal" style="--c:${v.color}">
      <div class="v-icon">${svg(v.icon)}</div>
      <div>
        <div class="v-label">${v.label.toUpperCase()}</div>
        <p class="v-head">${esc(d.headline)}</p>
        ${d.impersonating ? `<span class="pill">🎭 Impersonating: <strong>${esc(d.impersonating)}</strong></span>` : ''}
      </div>
      <div class="gauge" role="img" aria-label="Confidence ${conf} percent">
        <svg width="108" height="108" viewBox="0 0 108 108" aria-hidden="true">
          <circle class="track" cx="54" cy="54" r="44" fill="none" stroke-width="10"/>
          <circle class="fill" cx="54" cy="54" r="44" fill="none" stroke-width="10" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
        </svg>
        <div class="num"><span id="conf">0%</span><small>confidence</small></div>
      </div>
    </div>
    ${flags ? `<h2 class="reveal" style="--i:1">🚩 Red flags</h2>${flags}` : ''}
    ${steps ? `<h2 class="reveal" style="--i:2">✅ What to do</h2><ol class="steps">${steps}</ol>` : ''}
    <div class="result-actions reveal" style="--i:4">
      <button class="btn" type="button" id="again">↺ Check another</button>
      <button class="btn" type="button" id="copy">⧉ Copy result</button>
    </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    out.querySelector('.gauge .fill').style.strokeDashoffset = C * (1 - conf / 100);
  }));
  countUp($('conf'), conf);
  $('again').onclick = reset;
  $('copy').onclick = copyResult;
}

function countUp(el, target) {
  if (reduceMotion) { el.textContent = target + '%'; return; }
  const t0 = performance.now();
  const tick = t => {
    const p = Math.min(1, (t - t0) / 1200);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))) + '%';
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function renderError(msg) {
  out.innerHTML = `
    <div class="card err reveal">
      <div style="color:var(--scam)">${svg('<circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5m0 3.5h.01"/>', 32)}</div>
      <div>
        <h3>We couldn't finish that check</h3>
        <p>${esc(msg)}</p>
        <button class="btn primary" type="button" id="retry">↻ Try again</button>
      </div>
    </div>`;
  $('retry').onclick = submit;
  $('retry').focus();
}

function reset() {
  clearImage(); text.value = ''; out.innerHTML = ''; hint.textContent = ''; lastResult = null;
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  text.focus({ preventScroll: true });
}

async function copyResult() {
  const d = lastResult;
  const lines = [`ScamCheck verdict: ${VERDICTS[d.verdict].label.toUpperCase()} (${d.confidence}% confidence)`, d.headline];
  if (d.impersonating) lines.push(`Impersonating: ${d.impersonating}`);
  if (d.red_flags?.length) lines.push('', 'Red flags:', ...d.red_flags.map(f => `- "${f.quote}": ${f.why}`));
  if (d.next_steps?.length) lines.push('', 'What to do:', ...d.next_steps.map((s, i) => `${i + 1}. ${s}`));
  try { await navigator.clipboard.writeText(lines.join('\n')); toast('Result copied to clipboard'); }
  catch { toast("Couldn't copy. Your browser blocked clipboard access."); }
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
